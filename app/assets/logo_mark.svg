<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="F1 Insights mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4A3D"/><stop offset="1" stop-color="#C40000"/></linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0D0E13"/>
  <g clip-path="url(#tile)">
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2A2D3A" stroke-width="1.5"/>
    <!-- slanted bars: speed + data -->
    <path d="M11 49 L21 49 L25.5 37 L15.5 37 Z" fill="url(#r)"/>
    <path d="M25 49 L35 49 L41 29 L31 29 Z" fill="url(#r)"/>
    <path d="M39 49 L49 49 L57.5 18 L47.5 18 Z" fill="url(#r)"/>
    <!-- racing line: precision -->
    <path d="M6 55 C 20 55, 30 47, 38 36 S 52 17, 60 11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <!-- chequered corner -->
    <g fill="#FFFFFF"><rect x="10" y="10" width="4.5" height="4.5"/><rect x="19" y="10" width="4.5" height="4.5"/><rect x="14.5" y="14.5" width="4.5" height="4.5"/><rect x="10" y="19" width="4.5" height="4.5"/><rect x="19" y="19" width="4.5" height="4.5"/></g>
  </g>
</svg>
