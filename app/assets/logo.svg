<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 64" role="img" aria-label="F1 Insights" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g><defs>
